apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-bookstore
  labels:
    app: online-bookstore
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: online-bookstore
  template:
    metadata:
      labels:
        app: online-bookstore
    spec:
      containers:
        - name: online-bookstore
          image: blackwolf82007/online-bookstore:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: online-bookstore-service
spec:
  type: NodePort
  selector:
    app: online-bookstore
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081